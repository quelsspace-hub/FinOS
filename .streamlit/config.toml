[theme]
primaryColor = "#9ABF17"
backgroundColor = "#DDECF1"
secondaryBackgroundColor = "#AED9C5"
textColor = "#282900"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true

# Dark theme configuration
[theme.dark]
primaryColor = "#9ABF17"
backgroundColor = "#1a1a2e"
secondaryBackgroundColor = "#16213e"
textColor = "#eaeaea"
font = "sans serif"
